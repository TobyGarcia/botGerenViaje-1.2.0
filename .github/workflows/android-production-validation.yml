name: Validar Android por ambiente
on:
  workflow_dispatch:
  push:
    branches: ['release/production-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [gv.aspromex.mx, gvmobility.aspromex.mx]
    defaults:
      run:
        working-directory: frontend
    env:
      ANDROID_BUNDLED: 'true'
      ANDROID_WEB_URL: https://${{ matrix.host }}/conductor/
      VITE_API_BASE_URL: https://${{ matrix.host }}
      ANDROID_VERSION_NAME: '1.2.19'
      ANDROID_VERSION_CODE: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Verificar origen compilado
        run: grep -F '"https://${{ matrix.host }}"' android/app/build/generated/source/buildConfig/debug/com/aspromex/gerenciamientoviajes/BuildConfig.java
