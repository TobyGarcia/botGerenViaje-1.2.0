name: Android firmado
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión visible (ejemplo 1.1.0)'
        required: true
      version_code:
        description: 'Código entero mayor que cualquier APK anterior'
        required: true
      channel:
        type: choice
        options: [testing, stable]
        default: testing
permissions:
  contents: write
concurrency:
  group: android-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-${{ inputs.channel }}
    defaults:
      run:
        working-directory: frontend
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_UPDATE_CHANNEL: ${{ inputs.channel }}
      ANDROID_WEB_URL: ${{ vars.ANDROID_WEB_URL }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Preparar SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validar configuración y preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "$ANDROID_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$ANDROID_VERSION_CODE" -le 2100000000
          test -n "$ANDROID_WEB_URL"
          [[ "$ANDROID_WEB_URL" == https://* ]]
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compilar y verificar firma
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Publicar APK y manifiesto en borrador
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/gv-mobility.apk
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const tag = `android-${process.env.RELEASE_CHANNEL}-v${process.env.ANDROID_VERSION_NAME}-${process.env.ANDROID_VERSION_CODE}`;
          const sha256 = createHash('sha256').update(readFileSync('release/gv-mobility.apk')).digest('hex');
          writeFileSync('release/update.json', JSON.stringify({versionName:process.env.ANDROID_VERSION_NAME,versionCode:Number(process.env.ANDROID_VERSION_CODE),channel:process.env.RELEASE_CHANNEL,downloadUrl:`https://github.com/${process.env.REPOSITORY}/releases/download/${tag}/gv-mobility.apk`,sha256},null,2));
          JS
          TAG="android-${RELEASE_CHANNEL}-v${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}"
          ARGS=(--draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$RELEASE_CHANNEL" = testing ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" release/gv-mobility.apk release/update.json "${ARGS[@]}"
      - name: Retirar copia temporal de la firma
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
