services:
  postgres:
    image: postgres:16-alpine
    container_name: viajes-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Mexico_City

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/database/migrations:ro
      - ./database/seeds:/database/seeds:ro
      - ./database/scripts:/database/scripts:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - viajes_network
  backend:
    build: 
      context: ./backend
    container_name: viajes-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-America/Mexico_City}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}
    
    ports:
      - "${BACKEND_PORT:-3000}:3000"

    volumes:
      - ./backend/src:/app/src
    
    


    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: 
        [
          "CMD", 
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - viajes_network
  
  frontend:
    build:
      context: ./frontend

    container_name: viajes-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - viajes_network

  panel-admin:
    build: 
      context: ./panel-admin
      dockerfile: Dockerfile

    container_name: viajes-panel-admin

    restart: unless-stopped

    ports:
    - "8081:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [
        "CMD-SHELL",
        "wgwt -q --spider http://127.0.0.1/health || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - viajes_network

      
volumes:
  postgres_data:
    name: viajes_postgres_data

  backend_node_modules:
    name: viajes_backend_node_modules

  
networks:
  viajes_network:
    name: viajes_network
    driver: bridge
