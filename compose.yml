services:
  postgres:
    image: postgres:16-alpine
    container_name: viajes-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Mexico_City

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/database/migrations:ro
      - ./database/seeds:/database/seeds:ro
      - ./database/scripts:/database/scripts:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - viajes_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: viajes_ngrok
    restart: unless-stopped

    entrypoint:
      - /usr/bin/sh
      - /etc/ngrok/entrypoint.sh

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_MINI_APP_DOMAIN: ${NGROK_MINI_APP_DOMAIN:-}

    volumes:
      - ./ngrok.yml:/etc/ngrok/base.yml:ro
      - ./ngrok-entrypoint.sh:/etc/ngrok/entrypoint.sh:ro

    ports:
      - "4040:4040"

    depends_on:
      frontend:
        condition: service_started

    networks:
      - viajes_network

  backend:
    build: 
      context: ./backend
    container_name: viajes-backend
    restart: unless-stopped
    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-America/Mexico_City}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID}
      TELEGRAM_GROUP_SUPRVISOR_ID: ${TELEGRAM_GROUP_SUPRVISOR_ID}
      TELEGRAM_SUPERVISOR_BOT_TOKEN: ${TELEGRAM_SUPERVISOR_BOT_TOKEN}
      TELEGRAM_SUPERVISOR_BOT_USERNAME: ${TELEGRAM_SUPERVISOR_BOT_USERNAME}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_SUPERVISOR_WEB_APP_URL: ${TELEGRAM_SUPERVISOR_WEB_APP_URL}
      SUPERVISOR_REQUIRE_EMAIL_CONFIRMATION: ${SUPERVISOR_REQUIRE_EMAIL_CONFIRMATION:-false}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-8h}
      ADMIN_COOKIE_NAME: ${ADMIN_COOKIE_NAME:-admin_session}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_LOGIN_BLOCK_MINUTES: ${ADMIN_LOGIN_BLOCK_MINUTES:-15}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_CLIENT_SECRET_ID: ${AZURE_CLIENT_SECRET_ID:-}
      AZURE_TENANT_DOMAIN: ${AZURE_TENANT_DOMAIN:-}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-https://gv.aspromex.mx}
      SHAREPOINT_URL: ${SHAREPOINT_URL:-https://itzamnaoilandgas.sharepoint.com/sites/GerenciamientoViajes/Documentos%20compartidos/Forms/AllItems.aspx}
      SHAREPOINT_SITE_ID: ${SHAREPOINT_SITE_ID:-}
      SHAREPOINT_FOLDER_PATH: ${SHAREPOINT_FOLDER_PATH:-inspecciones}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-}
    
    ports:
      - "${BACKEND_PORT:-3000}:3000"

    volumes:
      - ./backend/src:/app/src
    
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: 
        [
          "CMD", 
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - viajes_network
  
  frontend:
    build:
      context: ./frontend

    container_name: viajes-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - viajes_network

  panel-admin:
    build: 
      context: ./panel-admin
      dockerfile: Dockerfile

    container_name: viajes-panel-admin

    restart: unless-stopped

    ports:
    - "8081:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q --spider http://127.0.0.1/health || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - viajes_network

      
volumes:
  postgres_data:
    name: viajes_postgres_data

  backend_node_modules:
    name: viajes_backend_node_modules

  
networks:
  viajes_network:
    name: viajes_network
    driver: bridge
