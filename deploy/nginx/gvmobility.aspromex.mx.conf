# Vhost del ambiente de prueba: https://gvmobility.aspromex.mx
#
# Copia del vhost de gv.aspromex.mx apuntando a los puertos del stack de prueba:
#   backend       127.0.0.1:3002
#   frontend      127.0.0.1:8082
#   panel-admin   127.0.0.1:8083
#
# Instalacion (requiere sudo):
#   sudo cp deploy/nginx/gvmobility.aspromex.mx.conf /etc/nginx/sites-available/gvmobility.aspromex.mx
#   sudo ln -s /etc/nginx/sites-available/gvmobility.aspromex.mx /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gvmobility.aspromex.mx
#
# Certbot agrega por su cuenta el bloque listen 443 con el certificado y la
# redireccion desde el puerto 80, igual que hizo con gv.aspromex.mx.

server {
    listen 80;
    server_name gvmobility.aspromex.mx;

    # API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check API
    location /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_set_header Host $host;
    }

    # Documentos y reportes PDF generados
    location /uploads/ {
        proxy_pass http://127.0.0.1:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicativo web movil de evaluacion
    location /evaluacion/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /evaluacion {
        return 301 /evaluacion/;
    }

    # Mini App del conductor
    location /conductor/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /conductor {
        return 301 /conductor/;
    }

    # Mini App del supervisor
    location /supervisor/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /supervisor {
        return 301 /supervisor/;
    }

    # Panel administrativo web
    location / {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
