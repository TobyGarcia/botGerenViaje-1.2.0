services:
  - type: web
    name: gerenciamiento-viajes-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gerenciamiento-viajes-db
          property: connectionString
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: ADMIN_COOKIE_SAME_SITE
        value: none
      - key: ADMIN_COOKIE_NAME
        value: admin_session
      - key: ADMIN_JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: ADMIN_LOGIN_BLOCK_MINUTES
        value: "15"
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEB_APP_URL
      - key: TELEGRAM_SUPERVISOR_WEB_APP_URL
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: TELEGRAM_GROUP_SUPRVISOR_ID
        sync: false
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_SUPERVISOR_WEB_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPERVISOR_EMAIL_CONFIRM_URL
        sync: false
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"

  - type: web
    name: gerenciamiento-viajes-miniapp
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GPS_TRACKING_INTERVAL_MS
        value: "30000"
      - key: VITE_GPS_SYNC_BATCH_SIZE
        value: "100"

  - type: web
    name: gerenciamiento-viajes-admin
    runtime: static
    rootDir: panel-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: gerenciamiento-viajes-db
    databaseName: gerenciamiento_viajes
    user: viajes_user
    region: oregon
    plan: free
